name: shakil_travels
description: Official native mobile application for SHAKIL TRAVELS recruitment ERP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & Serialization
  dio: ^5.4.0
  http: ^1.2.0

  # Secure Storage & Session
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # State Management & Service Locator
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  provider: ^6.1.1

  # UI & Accessibility
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  intl: '>=0.19.0 <1.0.0'
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/i18n/
