<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="sgm-grad-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sgm-grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sgm-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#sgm-grad-navy)" stroke="#334155" stroke-width="1.5" />

  <!-- Global Connectivity Meridian Arcs -->
  <circle cx="24" cy="24" r="14" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />
  <ellipse cx="24" cy="24" rx="7" ry="14" stroke="#64748b" stroke-width="1.2" opacity="0.5" />
  <line x1="10" y1="24" x2="38" y2="24" stroke="#475569" stroke-width="1" opacity="0.4" />

  <!-- Stylized Upward Opportunity & Talent Nexus Shape -->
  <!-- Left Wing / Arch -->
  <path d="M15 31C15 22 20 18 24 16C28 18 33 22 33 31" stroke="url(#sgm-grad-emerald)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central Pillar & Growth Arrow -->
  <path d="M24 33V18M24 18L20 22M24 18L28 22" stroke="url(#sgm-grad-emerald)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Human Star / Leadership Apex -->
  <circle cx="24" cy="12" r="3.2" fill="url(#sgm-grad-gold)" />
</svg>
